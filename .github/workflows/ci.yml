name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
  f1-windows-junction-validation:
    # Audit finding F1: the two junction/reparse-point tests are skipped on POSIX hosts and can only be
    # exercised on Windows. A skip here is treated as a failure so an unavailable junction capability
    # can never appear green.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confine TEMP and TMP to the runner temporary directory
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'f1-junction-tmp'
          $report = Join-Path $env:RUNNER_TEMP 'f1-junction-report'
          New-Item -ItemType Directory -Force -Path $tmp, $report | Out-Null
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "F1_REPORT_DIR=$report" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run the two Windows junction tests (focused unittest only)
        shell: cmd
        run: |
          python -m unittest -v tests.test_fssafety.ChainTests.test_windows_junction_parent_refused tests.test_sync_adapters.RefusalTests.test_t1_2_windows_junction_parent_refused > "%F1_REPORT_DIR%\unittest-output.txt" 2>&1
          echo %ERRORLEVEL% > "%F1_REPORT_DIR%\unittest-exit-code.txt"
          exit /b 0
      - name: Evaluate results and write the report (skip counts as failure)
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          $dir = $env:F1_REPORT_DIR
          $out = Get-Content -Raw (Join-Path $dir 'unittest-output.txt')
          $code = (Get-Content (Join-Path $dir 'unittest-exit-code.txt') | Select-Object -First 1).Trim()
          $os = Get-CimInstance Win32_OperatingSystem
          $py = (python -c "import sys, platform; print(sys.version.replace(chr(10), ' ')); print(platform.platform())") -join ' | '
          $tmpdir = python -c "import tempfile; print(tempfile.gettempdir())"
          $tests = @(
            'tests.test_fssafety.ChainTests.test_windows_junction_parent_refused',
            'tests.test_sync_adapters.RefusalTests.test_t1_2_windows_junction_parent_refused'
          )
          $failures = @()
          foreach ($t in $tests) {
            $name = $t.Split('.')[-1]
            $line = ($out -split "`r?`n") | Where-Object { $_ -match [regex]::Escape($name) } | Select-Object -First 1
            if (-not $line) { $failures += "no result line for $t" }
            elseif ($line -match '\.\.\. ok\s*$') { }
            elseif ($line -match 'skipped') { $failures += "SKIPPED, treated as failure (junction capability unavailable): $line" }
            else { $failures += "not ok: $line" }
          }
          if ($out -notmatch 'Ran 2 tests') { $failures += 'expected exactly 2 tests to run' }
          if ($out -match '(?m)^FAILED') { $failures += 'unittest reported FAILED' }
          if ($code -ne '0') { $failures += "unittest exit code $code" }
          $status = if ($failures.Count -eq 0) { 'PASS' } else { 'FAIL' }
          $report = @(
            '# f1-windows-junction-validation report',
            "workflow_run_id: $env:GITHUB_RUN_ID (attempt $env:GITHUB_RUN_ATTEMPT)",
            "pr_head_sha: $env:PR_HEAD_SHA",
            "checked_out_sha (github.sha; merge commit on pull_request events): $env:CHECKOUT_SHA",
            "git_rev_parse_HEAD: $(git rev-parse HEAD)",
            "windows: $($os.Caption) version $($os.Version) build $($os.BuildNumber); $([System.Environment]::OSVersion.VersionString); runner image $env:ImageOS $env:ImageVersion",
            "python: $py",
            "python_tempfile_gettempdir: $tmpdir",
            "TEMP=$env:TEMP",
            "TMP=$env:TMP",
            "RUNNER_TEMP=$env:RUNNER_TEMP",
            'executed_tests:'
          ) + ($tests | ForEach-Object { "  - $_" }) + @(
            "unittest_exit_code: $code",
            'unittest_output:',
            $out,
            "verdict: $status"
          ) + ($failures | ForEach-Object { "failure: $_" })
          $report | Set-Content -Path (Join-Path $dir 'report.txt') -Encoding utf8
          $report | Write-Output
          if ($status -ne 'PASS') {
            Write-Error ("f1-windows-junction-validation FAILED: " + ($failures -join '; '))
            exit 1
          }
      - name: Upload the focused unittest output and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1-windows-junction-validation
          path: ${{ env.F1_REPORT_DIR }}
          if-no-files-found: error
